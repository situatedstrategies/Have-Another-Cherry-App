# Post-deploy health checks.
# Runs when this file changes on the deploy branch: waits out the App Hosting
# rollout, then probes /api/recaptcha-health (gate-exempt, status only) and the
# /__/auth/handler proxy on the branded auth domain, so the results are visible
# in the Actions log. Re-run it any time by touching this file.
name: reCAPTCHA health check

on:
  push:
    branches:
      - development/web-production
    paths:
      - ".github/workflows/recaptcha-health.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for App Hosting rollout
        run: sleep 300
      - name: Probe recaptcha-health endpoint
        run: |
          curl -sS -m 30 "https://have-another-cherry--gen-lang-client-0987674990.us-east4.hosted.app/api/recaptcha-health" -o health.json -w "HTTP %{http_code}\n" || true
          echo "--- response body:"
          cat health.json || true
          echo
      - name: Probe auth handler proxy on branded domain
        run: |
          curl -sS -m 30 "https://app.haveanothercherry.com/__/auth/handler" -o handler.html -w "HTTP %{http_code}\n" || true
          echo "--- first 300 bytes (should be Firebase's handler page, not the site gate):"
          head -c 300 handler.html || true
          echo
      - name: Probe auth handler proxy on beta domain
        run: |
          curl -sS -m 30 "https://beta.haveanothercherry.com/__/auth/handler" -o beta-handler.html -w "HTTP %{http_code}\n" || true
          echo "--- first 300 bytes (should be Firebase's handler page):"
          head -c 300 beta-handler.html || true
          echo
      - name: Verify deployed bundle contains reCAPTCHA wiring (via ungated beta)
        run: |
          curl -sS -m 30 "https://beta.haveanothercherry.com/" -o index.html -w "HTTP %{http_code}\n" || true
          BUNDLE=$(grep -oE 'assets/index-[^"]+\.js' index.html | head -1)
          echo "bundle: ${BUNDLE:-not found}"
          if [ -n "$BUNDLE" ]; then
            curl -sS -m 30 "https://beta.haveanothercherry.com/$BUNDLE" -o bundle.js -w "HTTP %{http_code}\n" || true
            echo "recaptcha script loader present: $(grep -c 'recaptcha/enterprise.js' bundle.js || true)"
            echo "prod site key present: $(grep -c '6LemwG8t' bundle.js || true)"
            echo "beta site key present: $(grep -c '6LcWuokt' bundle.js || true)"
          fi
