# Deploys ONLY the beta project's Firestore rules.
# Production (gen-lang-client-0987674990) rules are deliberately never touched here.
# Authentication uses Workload Identity Federation, so there is no service account
# JSON key anywhere in this repo or in GitHub secrets.
# Note: the Run workflow button is unavailable while this file lives only on
# development/web-production, so pushes are the trigger.
name: Deploy Firestore Rules (beta)

on:
  push:
    branches:
      - development/web-production
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/deploy-firestore-rules.yml
  workflow_dispatch:

concurrency:
  group: firestore-rules-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-beta:
    name: Deploy rules to have-another-cherry-beta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check target is configured
        id: guard
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER_BETA }}
          WIF_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT_BETA }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            echo "::warning::GCP_WIF_PROVIDER_BETA and/or GCP_SERVICE_ACCOUNT_BETA are not set. Skipping the beta rules deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate to Google Cloud
        if: steps.guard.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_BETA }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_BETA }}

      - name: Deploy Firestore rules to beta
        if: steps.guard.outputs.configured == 'true'
        run: |
          npx --yes firebase-tools@14 deploy \
            --only firestore:rules \
            --project have-another-cherry-beta \
            --non-interactive
